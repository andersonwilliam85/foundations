name = "foundation"
version = "0.1.0"
defaultTargets = ["Hodge", "Poincare", "NavierStokes", "Bsd"]

# Pin matches lean-toolchain leanprover/lean4:v4.33.1.
# Hodge and Navier–Stokes may import mathlib. BSD / Poincaré must not be forced to.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

[[lean_lib]]
name = "Hodge"
srcDir = "."
roots = ["hodge.Proof", "hodge.Examples", "hodge.FromMathlib", "hodge.DeRham",
         "hodge.OmegaSheaf"]

[[lean_lib]]
name = "Poincare"
srcDir = "."
roots = ["poincare.Proof", "poincare.Examples", "poincare.FromMathlib"]

[[lean_lib]]
name = "NavierStokes"
srcDir = "."
roots = ["navierstokes.Proof", "navierstokes.Examples", "navierstokes.FromMathlib"]

[[lean_lib]]
name = "Bsd"
srcDir = "."
roots = ["bsd.Proof", "bsd.Examples", "bsd.FromMathlib"]
